services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      TZ: Europe/Kyiv
    ports:
      - "127.0.0.1:3004:3004"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3004/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
